# Subjects and courses shown on /courses/.
# To add a course: drop its HTML file(s) in _courses/<subject>/ and add an entry below.
# A subject with no courses yet is shown as "coming soon".

- id: math
  name: Mathematics
  icon: fa-solid fa-square-root-variable
  blurb: Plain-English notes that start with the picture and then bring in the symbols.
  courses:
    - title: Linear Algebra I
      level: First year
      description: >
        Sixteen lectures covering the whole course: vectors and the dot product, projections,
        lines and planes, row reduction and RREF, matrix algebra and inverses, span, bases and
        subspaces, linear transformations, determinants, eigenvalues and diagonalization,
        Gram–Schmidt, symmetric matrices and least squares, with midterm and final reviews.
      topics: [Vectors, Dot & cross product, Lines & planes, RREF, Matrices & inverses, Span & bases, Subspaces & rank, Transformations, Determinants, Eigenvalues, Diagonalization, Gram–Schmidt, Least squares]
      sections: 16
      editions:
        - label: Study notes
          note: Read online
          url: /courses/math/lin-algebra-1/linear-algebra-notes.html
          icon: fa-solid fa-book-open
        - label: Notes (PDF)
          note: Download for offline or print
          url: /courses/math/lin-algebra-1/linear-algebra-notes.pdf
          icon: fa-solid fa-file-pdf
          download: true
        - label: Practice solutions (PDF)
          note: Worked answers to every practice problem
          url: /courses/math/lin-algebra-1/practice-solutions.pdf
          icon: fa-solid fa-file-circle-check
          download: true

