# Subjects and courses shown on /courses/.
# To add a course: drop its HTML file(s) in _courses/<subject>/ and add an entry below.
# A subject with no courses yet is shown as "coming soon".

- id: math
  name: Mathematics
  icon: fa-solid fa-square-root-variable
  blurb: Plain-English notes that start with the picture and then bring in the symbols.
  courses:
    - title: Linear Algebra I
      level: First year
      description: >
        Sixteen lectures covering the whole course: vectors and the dot product, projections,
        lines and planes, row reduction and RREF, matrix algebra and inverses, span, bases and
        subspaces, linear transformations, determinants, eigenvalues and diagonalization,
        Gram–Schmidt, symmetric matrices and least squares, with midterm and final reviews.
      topics: [Vectors, Dot & cross product, Lines & planes, RREF, Matrices & inverses, Span & bases, Subspaces & rank, Transformations, Determinants, Eigenvalues, Diagonalization, Gram–Schmidt, Least squares]
      sections: 16
      editions:
        - label: Study notes
          note: Read online
          url: /courses/math/lin-algebra-1/linear-algebra-notes.html
          icon: fa-solid fa-book-open
        - label: Notes (PDF)
          note: Download for offline or print
          url: /courses/math/lin-algebra-1/linear-algebra-notes.pdf
          icon: fa-solid fa-file-pdf
          download: true
        - label: Practice solutions (PDF)
          note: Worked answers to every practice problem
          url: /courses/math/lin-algebra-1/practice-solutions.pdf
          icon: fa-solid fa-file-circle-check
          download: true

- id: physics
  name: Physics
  icon: fa-solid fa-atom
  blurb: Step-by-step notes that explain each idea from the ground up, then work the examples in full.
  courses:
    - title: Physics I & II
      level: First year
      description: >
        Twenty-four chapters over two semesters. Semester 1 covers mechanics, waves and
        thermal physics; semester 2 covers electricity, magnetism, optics and modern physics.
        Each chapter explains the ideas from the ground up, works examples in full and ends
        with practice problems, with a full solutions set for every chapter.
      topics: [Units & vectors, Kinematics, Newton's laws, Work & energy, Momentum, Rotation, Gravitation, Oscillations, Fluids, Waves & sound, Thermodynamics, Electric fields, Gauss's law, Potential & capacitance, DC circuits, Magnetism, Induction, AC & EM waves, Optics, Modern physics]
      sections: 24
      editions:
        - label: Course notes
          note: Read online, with per-chapter PDFs and solutions
          url: /courses/physics/phy-ug-1/index.html
          icon: fa-solid fa-book-open
        - label: Syllabus
          note: Course outline and how to study
          url: /courses/physics/phy-ug-1/syllabus.html
          icon: fa-solid fa-list-check
        - label: References
          note: Textbooks and further reading
          url: /courses/physics/phy-ug-1/references.html
          icon: fa-solid fa-bookmark
